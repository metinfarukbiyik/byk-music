name: Build & Release

# main dalına yapılan her push yeni bir sürüm üretir:
# Windows kurulum programı + macOS uygulaması derlenir ve GitHub Releases'e yüklenir.
# Kurulu uygulamalar bu sürümü otomatik bulur, indirir ve kurar.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"   # Windows konsolunda Türkçe karakterler için
  PYI_COMMON: >-
    --noconfirm --clean --windowed --name BYKMusic
    --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all certifi --collect-all qtawesome
    --add-data browser-extension:browser-extension

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Sürüm numarasını belirle
        run: |
          base=$(python3 -c "import re;print('.'.join(re.search(r'\"(\d+)\.(\d+)', open('byk_music/__init__.py').read()).groups()))")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Sürüm: ${base}.${GITHUB_RUN_NUMBER}"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python packaging/prepare.py $env:VERSION

      - name: Uygulamayı derle
        shell: bash
        run: pyinstaller $PYI_COMMON --icon assets/icon.ico --version-file build/version_info.txt main.py

      - name: Uygulamayı imzala (sertifika varsa)
        run: ./packaging/sign.ps1 dist\BYKMusic\BYKMusic.exe

      - name: Kurulum programını oluştur
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız" }

      - name: Kurulum programını imzala (sertifika varsa)
        run: ./packaging/sign.ps1 dist-installer\BYKMusic-Windows-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-installer/BYKMusic-Windows-Setup.exe

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python packaging/prepare.py "$VERSION"

      - name: Uygulamayı derle
        run: pyinstaller $PYI_COMMON --icon assets/icon.icns --osx-bundle-identifier dev.biyik.bykmusic main.py

      - name: Paket bilgilerini yaz ve paketle
        run: |
          plist=dist/BYKMusic.app/Contents/Info.plist
          plutil -replace CFBundleDisplayName -string "BYK Music" "$plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$plist"
          plutil -replace NSHumanReadableCopyright -string "© 2026 Metin Faruk Bıyık (biyik.dev)" "$plist"
          codesign --force --deep --sign - dist/BYKMusic.app
          ditto -c -k --keepParent dist/BYKMusic.app BYKMusic-macOS.zip
          mkdir dmg && cp -R "dist/BYKMusic.app" "dmg/BYK Music.app" && ln -s /Applications dmg/Applications
          hdiutil create -volname "BYK Music" -srcfolder dmg -ov -format UDZO BYKMusic-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            BYKMusic-macOS.zip
            BYKMusic-macOS.dmg

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Tarayıcı eklentisini paketle
        run: cd browser-extension && zip -r ../assets/BYKMusic-Browser-Extension.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: BYK Music v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: assets/*
